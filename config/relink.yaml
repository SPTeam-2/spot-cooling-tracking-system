# 인식부 ID 재연결 설정 (#18)
enabled: true
max_gap_s: 6.0        # 사라진 지 6초 이내면 같은 사람으로 이어붙이기 후보
base_dist: 0.8        # 기본 허용 거리 (박스 높이 배수)
dist_per_s: 1.25      # 사라진 1초마다 허용 거리 증가 (박스 높이 배수)
max_dist: 3.0         # 허용 거리 상한
size_ratio: [0.5, 2.0]  # 박스 높이 비율 허용 범위
min_life: 8           # 8번 이상 관측된 ID만 이어받기 후보 (깜빡인 가짜 ID 제외)
color_thresh: 0.5     # 옷 색 차이가 이보다 크면 이어붙이지 않음 (0~1)
confirm_n: 3          # 처음 보는 사람은 3프레임 연속으로 잡혀야 통합부로 전달