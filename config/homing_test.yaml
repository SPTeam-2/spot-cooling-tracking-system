# [테스트용] Homing 현장 시험 조건 — 실장비 확정값 아님
# [파일 목적] Pi에서 run_homing.py로 Homing을 시험할 때 쓰는 속도·이격·한도 관리
# [흐름] 값 입력 → run_homing.py로 사전 확인 → --home으로 Homing 1회
# null은 미확정 값. --home 실행 전 일곱 항목을 모두 채워야 함
# 실행: python3 scripts/carriage/pi/run_homing.py --home
# 원점 이격 거리: coordinate.yaml rail.home_offset_mm (현재 5mm)
# 방향(positive_dir_level)·속도 상한(max_speed)·통신 제한(io_timeout): stepper_test.yaml 값 사용
# 단위: 속도 steps/s, 거리 스텝 (1/8 마이크로스텝 기준 1mm = 40스텝)
# 속도는 PWM 허용 주파수만 가능 (방식 A): 현장 안정값 200 또는 250, 짧은 이동·느린 접근은 160

fast_speed_steps_s: null   # 1차 접근·이격 속도, stepper_test.yaml max_speed 이하 (예: 200)
slow_speed_steps_s: null   # 2차 재접근·원점 이격 속도, fast 이하 (예: 160)
backoff_steps: null        # 1차 접촉 후 이격량 / 시작 시 왼쪽이 눌려 있으면 빠져나오는 양
max_seek_steps: null       # 1차 접근 최대 스텝, 레일 전체 길이보다 크게
max_reseek_steps: null     # 2차 재접근 최대 스텝, backoff_steps보다 크게
phase_timeout_s: null      # 단계별 제한 시간(초)
settle_s: null             # 접촉 감지 후 입력 재확인까지 대기(초), 0 가능
