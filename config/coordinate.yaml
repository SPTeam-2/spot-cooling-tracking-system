# 좌표 변환 설정 (단위: mm)

# 실제 기준점 4개: 사람이 걷는 선 위에 세운 세로 판의 네 모서리
#   x = 통로 방향 거리 (시작점 0), z = 바닥에서의 높이
real_points:
  - [0, 0]        # 1. 시작점, 바닥
  - [2000, 0]     # 2. 끝점, 바닥
  - [2000, 1500]  # 3. 끝점, 높이 1.5m
  - [0, 1500]     # 4. 시작점, 높이 1.5m

real_range: [0, 2000]   # 실제 작업자 이동 범위 x (mm)
rail_range: [0, 600]    # 레일 위 캐리지 이동 범위 (mm) — 임시값, 구동부 값 받으면 수정

homography_file: data/calibration/homography.npz