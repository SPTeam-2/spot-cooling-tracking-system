# 좌표 · 제어 통합 설정 (단위: 거리 mm, 송풍세기 %)
# ── 좌표 변환부(인식/좌표): real_points, real_range, rail_range, homography_file
# ── 제어/송풍부(통합):     rail, stepper, fan_power, control, priority

# ===== 좌표 변환 (인식·좌표부) =====
# 실제 기준점 4개: 사람이 걷는 선 위에 세운 세로 판의 네 모서리
#   x = 통로 방향 거리 (시작점 0), z = 바닥에서의 높이
real_points:
  - [0, 0]        # 1. 시작점, 바닥
  - [2000, 0]     # 2. 끝점, 바닥
  - [2000, 1500]  # 3. 끝점, 높이 1.5m
  - [0, 1500]     # 4. 시작점, 높이 1.5m

real_range: [0, 2000]   # 실제 작업자 이동 범위 x (mm)
rail_range: [0, 600]    # 레일 위 캐리지 이동 범위 (mm) — 임시값, 구동부 값 받으면 수정

homography_file: data/calibration/homography.npz

# ===== 제어 / 송풍 (통합부) =====
# 좌표 원점: 레일 왼쪽 끝 X=0, 레일 중심선 Y=0, 책상면 Z=0 (도면집 기준)
# rail_* 값은 추정치. 조립 후 Homing 실측하여 갱신할 것. (위 rail_range와 동일 레일을 가리킴)
rail:
  length_mm: 800          # 2040 V슬롯 전체 길이
  travel_mm: 530          # 캐리지 중심 이동 범위 (추정, 실측 후 갱신)
  limit_left_mm: 75       # 왼쪽 리미트 스위치 위치 (X)
  limit_right_mm: 725     # 오른쪽 리미트 스위치 위치 (X)
  home_offset_mm: 5       # Homing 접촉 지점에서 원점(0)까지 여유

stepper:
  microstep: 16           # A4988 마이크로스텝 (1/16)
  steps_per_rev: 200      # NEMA17 기본 (1.8도)
  belt_pitch_mm: 2        # GT2
  pulley_teeth: 20        # 20T → 1회전당 40mm 이동
  # mm_per_step = (pitch * teeth) / (steps_per_rev * microstep) = 40 / 3200 = 0.0125

# 거리(cm) → 송풍 세기 3단계 (멀수록 강풍)
fan_power:
  near_max_cm: 50         # ≤50cm  → 미풍
  mid_max_cm: 120         # 50~120 → 약풍
  duty_near: 40           # 미풍 (%) — 하한(이 이하면 팬 안 돎)
  duty_mid: 70            # 약풍
  duty_far: 100           # 강풍
  hysteresis_cm: 5        # 구간 경계 떨림 방지

# 제어 로직 파라미터
control:
  no_person_timeout_s: 30   # 미검출 지속 시 자동 정지
  cooldown_s: 5             # 방금 송풍받은 대상 재선정 제외 시간
  min_dwell_s: 8            # 한 대상 최소 유지 송풍 시간 (잦은 왕복 방지)
  deadzone_mm: 20           # 작은 좌표 흔들림 무시 (재이동 안 함)

# 우선순위 "유사" 임계값 (단계식 동점 처리) — 공정성↔효율성 다이얼
# 값이 클수록 "비슷하게 받았으면 가까운 사람 먼저"가 자주 발동 → 캐리지 이동↓(효율),
# 송풍시간 차이 허용폭↑(공정성 약간 느슨). 시뮬레이션상 20s가 균형점
# (캐리지 이동 약 18%↓, 공정성 편차 5명까지 20% 목표 이내). 실기기에서 재튜닝 필요.
priority:
  cooled_similar_s: 20
  wait_similar_s: 20